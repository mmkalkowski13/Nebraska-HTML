<!DOCTYPE html>

</head>

<body>

<!-- Top Bar -->
<div class="top-bar">

    <span class="mobile-title"><a href="index.html" class="home-link">Nebraska</a></span>

        <option value="wisconsin">Nebraska vs. Wisconsin</option>
        <option value="maryland">Nebraska vs. Maryland</option>
        <option value="rutgers">Nebraska vs. Rutgers</option>
