    const gameSelector = document.getElementById("game-selector");

        activeGame = gameSelector.value;

    // =========================================================

    // =========================================================

    function openGameBox() {

        const game = games[activeGame];

        if (!game) {
            return;
        }

        document.getElementById("game-box-3").style.display = "block";

        document.getElementById("game-photo-3").src = game.photo;

        document.getElementById("game-photo-3").alt = game.name;

        document.getElementById("game-name-3").textContent = game.name;

        loadGameStats();

    }

    // =========================================================

    document.getElementById("btn-stats-3").addEventListener("click", () => {

        loadGameStats();

        loadXG();

    });

    // =========================================================

    function setActiveButton(button) {

        document.querySelectorAll(".game-tab-3").forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");

    }

    function loadXG() {

        const game = games[activeGame];

        if (!game) return;

        setActiveButton(document.getElementById("btn-xg-3"));

        document.getElementById("game-box-content-3").innerHTML = `

            <div class="xg-field-3">

                <div class="sideline-3"></div>

                <div class="endline-3"></div>

                <div class="six-yard-box-3"></div>

                <div class="penalty-arc-3"></div>

            </div>


            <div id="shot-info-3">
                Click a shot to see details.
            </div>


            <div class="top-stats-row-3">

                <div class="top-stat-box-3">
                    <span class="stat-label-3">Minutes</span>
                    <span class="stat-value-3">
                        ${game.xg.minutes}
                    </span>
                </div>

                <div class="top-stat-box-3">
                    <span class="stat-label-3">Total Shots</span>
                    <span class="stat-value-3">
                        ${game.xg.totalShots}
                    </span>
                </div>

                <div class="top-stat-box-3">
                    <span class="stat-label-3">Total xG</span>
                    <span class="stat-value-3">
                        ${game.xg.totalXG}
                    </span>
                </div>

            </div>
        `;


        // Add shots AFTER the field exists

        game.xg.shots.forEach(shot => {

            addShotDot(
                shot.x,
                shot.y,
                shot.minute,
                shot.xg,
                shot.shotType,
                shot.situation,
                shot.result,
                shot.goal
            );

        });

    }


    // =========================================================
    // ADD SHOT DOT
    // =========================================================

    function addShotDot(
        x,
        y,
        minute,
        xg,
        shotType,
        situation,
        result,
        goal
    ) {

        const layer = document.querySelector(".xg-dot-layer-3");

        const dot = document.createElement("div");

        dot.classList.add(
            goal ? "xg-dot-goal-3" : "xg-dot-3"
        );

        dot.style.left = x + "%";

        dot.style.top = y + "%";


        dot.addEventListener("click", () => {

            document.getElementById("shot-info-3").innerHTML = `

                <strong>Minute:</strong> ${minute}
                &nbsp; | &nbsp;

                <strong>xG:</strong> ${xg}

                <br>

                <strong>Shot Type:</strong> ${shotType}
                &nbsp; | &nbsp;

                <strong>Situation:</strong> ${situation}

                <br>

                <strong>Result:</strong> ${result}

            `;

        });


        layer.appendChild(dot);

    }

});
